
name: Bug Report
description: Report a bug or unexpected behaviour in an NITM-SOSC project.
title: "[BUG]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug!
        Please provide enough information for maintainers to investigate it.

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Clearly describe the problem.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Explain how maintainers can reproduce the issue.
      placeholder: |
        1. Open...
        2. Navigate to...
        3. Click...
        4. Observe the error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, device or relevant software versions.
      placeholder: macOS 15, Chrome 130, Ubuntu 24.04...

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: Attach screenshots, error messages or relevant logs.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have provided sufficient information to investigate this bug.
          required: true
